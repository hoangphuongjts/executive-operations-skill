services:
  research-agents:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_DB_PATH: /data/agents.sqlite3
      AGENT_ALLOW_PUBLIC_BIND: "1"
    ports:
      - "127.0.0.1:8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 80
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  agent_data: {}
